<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PocketTrack</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <h2>PocketTrack</h2>

            <a href="#">Dashboard</a>

            <a href="#">Add Expense</a>

            <a href="#">History</a>

            <a href="#">Summary</a>

        </aside>

        <main class="main-content">

            <h1>Dashboard</h1>

            <p>Track your expenses and manage your student budget.</p>

            <section class="cards">

                <div class="card">

                    <h3>Total Spent</h3>

                    <p>$420</p>

                </div>

                <div class="card">

                    <h3>Monthly Budget</h3>

                    <p>$800</p>

                </div>

                <div class="card">

                    <h3>Remaining</h3>

                    <p>$380</p>

                </div>

            </section>

            <section class="expense-section">

                <h2>Recent Expenses</h2>

                <table>

                    <tr>

                        <th>Date</th>

                        <th>Category</th>

                        <th>Description</th>

                        <th>Amount</th>

                    </tr>

                    <tr>

                        <td>May 6</td>

                        <td>Food</td>

                        <td>Lunch</td>

                        <td>$12</td>

                    </tr>

                    <tr>

                        <td>May 5</td>

                        <td>Transport</td>

                        <td>Uber</td>

                        <td>$18</td>

                    </tr>

                </table>

            </section>

        </main>

    </div>

</body>

</html>
